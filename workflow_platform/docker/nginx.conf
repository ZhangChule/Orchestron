server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /favicon.ico {
    return 204;
  }

  location /api/wall-thickness-compensation/ {
    set $wtc_gateway host.docker.internal:18090;
    proxy_pass http://$wtc_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 128m;
  }

  location /api/virtual-machining/ {
    rewrite ^/api/virtual-machining/(.*)$ /$1 break;
    proxy_pass http://virtual-machining-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 128m;
  }

  location /api/ {
    return 404;
  }

  location ~* \.wasm\.gz$ {
    gzip off;
    types {}
    default_type application/wasm;
    add_header Content-Encoding gzip always;
    try_files $uri =404;
  }

  location ~* \.js\.gz$ {
    gzip off;
    types {}
    default_type application/javascript;
    add_header Content-Encoding gzip always;
    try_files $uri =404;
  }

  location ~* \.data\.gz$ {
    gzip off;
    types {}
    default_type application/octet-stream;
    add_header Content-Encoding gzip always;
    try_files $uri =404;
  }

  location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|ico|json|txt|wasm|data)$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}

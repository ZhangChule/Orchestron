<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Platform</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="platform-shell">
      <header class="topbar">
        <div class="brand-block">
          <span data-i18n="topbar.label">Public Workflow Platform</span>
          <h1 data-i18n="topbar.title">Process Graph Canvas</h1>
        </div>

        <div class="topbar-actions">
          <label class="language-control" for="languageSelect">
            <span data-i18n="language.label">Language</span>
            <select id="languageSelect">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>

          <label class="endpoint-control" for="apiBase">
            <span data-i18n="endpoint.label">API Base</span>
            <input id="apiBase" value="http://localhost/api/process-a" />
          </label>

          <button id="loadManifest" type="button" data-i18n="actions.load">Load Process</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="palette">
          <div class="panel-title">
            <span data-i18n="catalog.label">Catalog</span>
            <strong data-i18n="catalog.title">Process Apps</strong>
          </div>
          <div id="processCatalog" class="process-list"></div>
        </aside>

        <section class="canvas-panel">
          <div class="graph-toolbar">
            <div>
              <span data-i18n="canvas.label">Canvas</span>
              <strong id="graphStatus" data-i18n="status.ready">Ready</strong>
            </div>
            <div class="toolbar-actions">
              <select id="logicNodeKind" class="toolbar-select" aria-label="Logic node type">
                <option value="condition">condition</option>
                <option value="stop">stop / convergence</option>
                <option value="parameter-update">parameter-update</option>
                <option value="human-review">human-review</option>
              </select>
              <button id="addLogicNode" class="secondary" type="button" data-i18n="actions.addLogic">Add Logic Node</button>
              <button id="addVirtualNode" class="secondary" type="button" data-i18n="actions.addVirtual">Add Virtual Node</button>
              <button id="loadClosedLoopDemo" class="secondary" type="button" data-i18n="actions.loadClosedLoopDemo">Load Closed-loop Demo</button>
              <button id="exportRunSnapshot" class="secondary" type="button" data-i18n="actions.exportSnapshot">Export Snapshot</button>
              <button id="importRunSnapshot" class="secondary" type="button" data-i18n="actions.importSnapshot">Import Snapshot</button>
              <input id="snapshotImportFile" class="hidden-file-input" type="file" accept="application/json,.json">
              <button id="clearLinks" class="secondary" type="button" data-i18n="actions.clearLinks">Clear Links</button>
              <button id="resetLayout" class="secondary" type="button" data-i18n="actions.resetLayout">Reset Layout</button>
              <button id="openNodeConfig" class="secondary" type="button" data-i18n="actions.configure">Configure Node</button>
              <button id="openStandalone" class="secondary" type="button" data-i18n="actions.openApp">Open App</button>
              <button id="runFromSelected" class="secondary" type="button" data-i18n="actions.runFromSelected">Run From Selected</button>
              <button id="runWorkflow" type="button" data-i18n="actions.run">Run Workflow</button>
            </div>
          </div>

          <div id="graphCanvas" class="graph-canvas" aria-label="workflow canvas"></div>
        </section>

        <aside class="right-rail">
          <section id="virtualDock" class="virtual-dock" aria-label="virtual machining dock">
            <header>
              <div>
                <span data-i18n="virtual.label">Virtual Machining</span>
                <strong data-i18n="virtual.dockTitle">Unity Machining Scene</strong>
              </div>
              <div class="virtual-actions">
                <button id="loadVirtualMachining" type="button" data-i18n="actions.loadVirtual">Load Unity</button>
                <button id="resetVirtualScene" class="secondary" type="button" data-i18n="actions.resetScene">Reset Scene</button>
              </div>
            </header>
            <div class="virtual-content">
              <div class="virtual-canvas-wrap">
                <canvas id="virtualMachiningCanvas" tabindex="-1"></canvas>
                <div class="virtual-status">
                  <progress id="virtualMachiningProgress" max="1" value="0"></progress>
                  <span id="virtualMachiningStatus" data-i18n="virtual.statusIdle">Unity not loaded</span>
                </div>
              </div>
              <ol id="virtualMachiningLog" class="virtual-log" aria-label="virtual machining log"></ol>
            </div>
          </section>

          <section class="runtime-panel">
            <div class="panel-title">
              <span data-i18n="runtime.label">Run Snapshot</span>
              <strong id="eventLogCount">0 events</strong>
            </div>
            <details open>
              <summary data-i18n="runtime.eventLog">Event Log</summary>
              <ol id="eventLogList" class="event-log-list" aria-label="execution event log"></ol>
            </details>
          </section>

          <section class="inspector">
            <div class="panel-title">
              <span data-i18n="inspector.label">Inspector</span>
              <strong id="inspectorTitle">ARPPL</strong>
            </div>
            <div id="inspectorContent" class="inspector-content"></div>
          </section>
        </aside>
      </section>
    </main>

    <dialog id="nodeDialog" class="node-dialog">
      <form method="dialog">
        <header>
          <div>
            <span id="dialogKicker">ARPPL</span>
            <strong id="dialogTitle" data-i18n="dialog.title">Configure Process Node</strong>
          </div>
          <button class="secondary" value="cancel" type="submit" data-i18n="actions.close">Close</button>
        </header>

        <section id="dialogBody" class="dialog-body"></section>

        <footer>
          <div id="dialogFooter" class="dialog-footer"></div>
        </footer>
      </form>
    </dialog>

    <menu id="nodeMenu" class="node-menu">
      <button id="menuConfigure" type="button" data-i18n="actions.configure">Configure Node</button>
      <button id="menuRun" type="button" data-i18n="actions.run">Run Workflow</button>
      <button id="menuOpenApp" type="button" data-i18n="actions.openApp">Open App</button>
      <button id="menuClearLinks" type="button" data-i18n="actions.clearLinks">Clear Links</button>
      <button id="menuDeleteNode" type="button" data-i18n="actions.deleteNode">Delete Node</button>
    </menu>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>

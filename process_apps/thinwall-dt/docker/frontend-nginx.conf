server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~* \.wasm\.gz$ {
    gzip off;
    types {}
    default_type application/wasm;
    add_header Content-Encoding gzip always;
    try_files $uri =404;
  }

  location ~* \.js\.gz$ {
    gzip off;
    types {}
    default_type application/javascript;
    add_header Content-Encoding gzip always;
    try_files $uri =404;
  }

  location ~* \.data\.gz$ {
    gzip off;
    types {}
    default_type application/octet-stream;
    add_header Content-Encoding gzip always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
